[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scandeck"
version = "0.1.0"
description = "Cross-platform agent session monitor + worktree manager"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "CoreForged LLC", email = "corporate@coreforged.com"},
]
keywords = ["ai", "agent", "monitor", "worktree", "mcp", "claude", "cursor", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10.0"]

[project.scripts]
scandeck = "scandeck.cli:main"

[project.urls]
Homepage = "https://github.com/MithrynMarious/scandeck"
Repository = "https://github.com/MithrynMarious/scandeck"
Issues = "https://github.com/MithrynMarious/scandeck/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["scandeck/", "LICENSE", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["scandeck"]
